<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — SSA</title>
  <link rel="icon" type="image/png" href="/assets/brand/ssa-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/index.css" />
  <link rel="stylesheet" href="/site-pages.css" />
  <script src="/api.js"></script>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('ssaTheme') || 'light');</script>
</head>
<body class="events-page">
  <nav class="nav page-nav" aria-label="Primary navigation">
    <button class="nav-menu-toggle" id="navMenuToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Open menu"><span class="nav-menu-icon" aria-hidden="true"></span></button>
    <a class="brand" href="/index.html"><img src="/assets/brand/ssa-logo.png" alt="SSA logo" /><span>SSA</span></a>
    <div class="nav-links" id="navLinks">
      <a href="/index.html">Home</a>
      <a href="/events" class="active">Events</a>
      <a href="/games">Games</a>
      <a href="/aux">Want The Aux</a>
      <button type="button">Options</button>
    </div>
    <div class="nav-tools"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Change theme"><span class="theme-icon" aria-hidden="true"></span></button></div>
  </nav>
  <main class="page-main">
    <header class="page-hero" data-reveal><span class="eyebrow">Calendar</span><h1>SSA Events</h1><p>RSVP, show up, bring friends.</p></header>
    <aside class="featured-event" id="eventsFeatured" aria-label="Featured event" data-reveal hidden></aside>
    <div class="event-grid" id="eventsGrid" data-reveal-group></div>
    <p style="text-align:center;margin-top:32px" data-reveal><button type="button" class="button button-line" data-suggest-event>Suggest an event</button></p>
  </main>
  <div class="modal-backdrop" id="rsvpModal" aria-hidden="true">
    <div class="rsvp-modal modal-sheet modal-card modal-card-compact" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
      <span class="eyebrow">RSVP</span>
      <h2 id="rsvpTitle">Event</h2>
      <p id="rsvpMeta"></p>
      <p class="rsvp-modal-count" id="rsvpModalCount"></p>
      <form id="rsvpForm">
        <input type="hidden" name="event" />
        <input type="hidden" name="date" />
        <input type="text" name="name" placeholder="Name" required autocomplete="name" />
        <fieldset class="rsvp-choice">
          <legend>Are you a student at the U of MN?</legend>
          <div><label><input type="radio" name="isStudent" value="yes" required /><span>Yes</span></label><label><input type="radio" name="isStudent" value="no" /><span>No</span></label></div>
        </fieldset>
        <fieldset class="rsvp-choice rsvp-age-question" hidden>
          <legend>Are you 18 or older?</legend>
          <div><label><input type="radio" name="isOver18" value="yes" /><span>Yes</span></label><label><input type="radio" name="isOver18" value="no" /><span>No</span></label></div>
        </fieldset>
        <button class="button button-dark" type="submit">RSVP</button>
        <output></output>
      </form>
      <form id="quickRsvpForm" class="quick-rsvp-form" hidden>
        <input type="hidden" name="event" />
        <input type="hidden" name="date" />
        <h3>Are you coming?</h3>
        <div class="quick-rsvp-actions"><button class="button button-dark" type="button" data-quick-coming="yes">Yes!</button><button class="button button-line" type="button" data-quick-coming="no">No</button></div>
        <output></output>
      </form>
      <div class="rsvp-result" id="rsvpResult" hidden></div>
    </div>
    <button class="modal-exit" type="button" aria-label="Close"><svg viewBox="0 0 44 44" aria-hidden="true"><path class="modal-exit-path" d="M22 6 C33 5 38 15 38 22 C38 33 29 38 22 38 C11 38 6 29 6 22 C6 11 14 6 22 6 Z"/><path class="modal-exit-x" d="M16.5 16.5 L27.5 27.5 M27.5 16.5 L16.5 27.5"/></svg></button>
  </div>
  <footer class="footer"><div class="footer-card"><a class="footer-brand" href="/index.html"><img src="/assets/brand/ssa-logo.png" alt="" />SSA</a><small>© 2026 SSA — U of M</small></div></footer>
  <script src="/motion.js"></script><script src="/nav.js?v=4"></script>
  <script src="/events-render.js?v=5"></script>
  <script src="/rsvp.js?v=2"></script>
  <script src="/outreach.js?v=2"></script>
</body>
</html>
