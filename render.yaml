# Render Blueprint — web service + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ssa-db
    plan: free
    databaseName: ssa
    user: ssa

services:
  - type: web
    name: ssa-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-db
          property: connectionString
