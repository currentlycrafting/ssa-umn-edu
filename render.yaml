# Render Blueprint — web service + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ssa-db
    plan: free
    databaseName: ssa
    user: ssa

services:
  - type: web
    name: ssa-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BASE_URL
        value: https://www.ssaumn.com
      - key: SECRET_KEY
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        value: 6e06bc4ac68246ca9c9d3badaa9f1c52
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        value: SSA
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-db
          property: connectionString
